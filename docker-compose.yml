version: "3.8"
services:
  as2:
    image: greicodex/openas2:4.1.0
    container_name: as2-server
    ports:
      - "10080:10080"   # HTTP
      - "8443:8443"     # HTTPS
    volumes:
      - ./as2/config:/opt/openas2/config
      - ./as2/inbox:/opt/openas2/inbox
      - ./as2/outbox:/opt/openas2/outbox
    restart: unless-stopped


# Start the container:
# docker-compose up -d or docker pull greicodex/openas2:4.1.0

